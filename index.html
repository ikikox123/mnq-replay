<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>MNQ 回放練習</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"PingFang TC",sans-serif;background:#111;color:#eee;padding:env(safe-area-inset-top) 8px 20px}
h1{font-size:17px;margin:8px 0}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
button,select,input{font-size:16px;border-radius:8px;border:1px solid #444;background:#222;color:#eee;padding:8px 10px}
button.on{background:#2962ff;border-color:#2962ff}#next{flex:1;font-size:22px;padding:14px;background:#2962ff}
#chart{position:relative;width:100%;height:52vh;min-height:300px}input{width:100%}.f{flex:1;min-width:0}
.L{background:#1b5e20!important}.S{background:#b71c1c!important}#info{font-size:14px;color:#ccc;min-height:20px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid #333;padding:4px;text-align:right}
.card{background:#1a1a1a;border-radius:10px;padding:8px;margin:8px 0}.pos{color:#4caf50}.neg{color:#f44336}small{color:#999}
</style></head><body>
<h1>MNQ 1分K 回放練習</h1>
<div class="row"><select id="day" class="f"></select><button id="rnd">🎲 隨機</button><button id="tf">1m</button><button id="ovb" class="on">指標 v0.4</button></div>
<div id="chart"></div>
<div id="info"></div>
<div class="row"><button id="next">下一根 ▶</button></div>
<div class="row"><button id="play">⏵ 自動</button><select id="spd"><option value="1000">1x</option><option value="300">3x</option><option value="100">10x</option><option value="30">30x</option></select><button id="j10">跳到 10:00</button><button id="end">播完</button></div>
<div class="card"><div class="row"><button id="bL" class="on L">做多</button><button id="bS">做空</button><button id="mk" class="on">市價</button><button id="lm">限價</button></div>
<div class="row"><div class="f"><small>進場(限價)</small><input id="pe" type="number" step="0.25" inputmode="decimal"></div><div class="f"><small>止損</small><input id="psl" type="number" step="0.25" inputmode="decimal"></div><div class="f"><small>停利</small><input id="ptp" type="number" step="0.25" inputmode="decimal"></div></div>
<div class="row"><button id="fill" class="f">📐 帶入指標建議</button></div><div id="sug"><small></small></div>
<div class="row"><button id="send" class="f">送出</button><button id="cxl">取消/平倉</button></div><div id="ord"><small>無持倉</small></div></div>
<div class="card" id="ansBox" style="display:none"><button id="ans" class="f">🔍 看答案（ATM v0.3 / v0.4）</button><div id="ansTxt"></div></div>
<div class="card"><b>成績</b> <span id="stat"></span><table id="log"></table><div class="row"><button id="clr">清除紀錄</button></div></div>
<small><!--OVL-v2--> 指標只用「已播出的 K 棒」逐根計算，不會偷看未來。黃=亞盤高低，綠/紅框=多/空 OB（虛線=50%），灰=作廢，洋紅=v0.4 單邊小OB，橘=補掛限價。<br>1 口 MNQ = $2/點。同一根同時碰到止損與停利時算止損。15:00 強制平倉。時間為台北時間。</small>

const ch=LightweightCharts.createChart($('chart'),{layout:{background:{color:'#111'},textColor:'#ccc'},grid:{vertLines:{color:'#222'},horzLines:{color:'#222'}},timeScale:{timeVisible:true,secondsVisible:false,rightOffset:8},rightPriceScale:{scaleMargins:{top:.08,bottom:.08}}});
const shade=ch.addHistogramSeries({priceScaleId:'sh',color:'rgba(255,235,59,.13)',priceLineVisible:false,lastValueVisible:false});
ch.priceScale('sh').applyOptions({scaleMargins:{top:0,bottom:0},visible:false});
const cs=ch.addCandlestickSeries({upColor:'#26a69a',downColor:'#ef5350',borderVisible:false,wickUpColor:'#26a69a',wickDownColor:'#ef5350'});
new ResizeObserver(()=>ch.applyOptions({width:$('chart').clientWidth,height:$('chart').clientHeight})).observe($('chart'));
let day,bars,idx,tf=1,timer=null,lines=[],ordLines=[],side=1,typ='mk',order=null,revealed=false,asiaS,asiaE,asiaDrawn;
function dstUS(d){const y=+d.slice(0,4),m=+d.slice(5,7),dd=+d.slice(8,10);const sun=(mo,n)=>{const f=new Date(Date.UTC(y,mo-1,1)).getUTCDay();return 1+(7-f)%7+7*(n-1)};
 if(m<3||m>11)return false;if(m>3&&m<11)return true;if(m==3)return dd>=sun(3,2);return dd<sun(11,1)}
function hm(t){const x=new Date((t+TZ)*1000);return String(x.getUTCHours()).padStart(2,'0')+':'+String(x.getUTCMinutes()).padStart(2,'0')}
function load(d){stop();day=d;$('day').value=d;const r=D[d];bars=r.b.map(b=>({time:r.t0+b[0]*60,open:b[1]/4,high:b[2]/4,low:b[3]/4,close:b[4]/4}));
 const w=dstUS(d)?0:3600;asiaS=r.t0+600+w;asiaE=asiaS+3600;asiaDrawn=false;idx=Math.max(1,bars.findIndex(b=>b.time>=r.t0+60));
 order=null;revealed=false;clearLines(lines);clearLines(ordLines);cs.setMarkers([]);$('ansBox').style.display='none';$('ansTxt').innerHTML='';draw();ch.timeScale().fitContent();showOrd()}
function clearLines(a){a.forEach(l=>cs.removePriceLine(l));a.length=0}
function agg(a){if(tf==1)return a;const o=[];for(const b of a){const k=b.time-b.time%300;const l=o[o.length-1];if(l&&l.time==k){l.high=Math.max(l.high,b.high);l.low=Math.min(l.low,b.low);l.close=b.close}else o.push({...b,time:k})}return o}
function sh(t){return t+TZ}
function draw(){const v=agg(bars.slice(0,idx)).map(b=>({...b,time:sh(b.time)}));cs.setData(v);
 shade.setData(v.map(b=>({time:b.time,value:1,color:(b.time-TZ>=asiaS&&b.time-TZ<asiaE)?'rgba(255,235,59,.15)':'rgba(0,0,0,0)'})));
 const cur=bars[idx-1];if(!asiaDrawn&&cur.time+60>=asiaE){const a=bars.filter(b=>b.time>=asiaS&&b.time<asiaE);if(a.length){const H=Math.max(...a.map(b=>b.high)),L=Math.min(...a.map(b=>b.low));
  lines.push(cs.createPriceLine({price:H,color:'#fdd835',lineWidth:1,lineStyle:2,title:'亞盤高'}));lines.push(cs.createPriceLine({price:L,color:'#fdd835',lineWidth:1,lineStyle:2,title:'亞盤低'}))}asiaDrawn=true}
 $('info').textContent=`${day} ${hm(cur.time)}  收 ${cur.close}  高 ${cur.high} 低 ${cur.low}`+(done()?'  — 今日結束':'');
 if(done())$('ansBox').style.display='block';requestAnimationFrame(ovDraw)}
function done(){return idx>=bars.length||bars[idx-1].time+60>=D[day].t0+33000}
function step(){if(done()){stop();return}idx++;const b=bars[idx-1];sim(b);draw()}
function sim(b){if(!order)return;const o=order;
 if(o.st=='pend'){if(o.dir==1?b.low<=o.e:b.high>=o.e){o.st='open';o.ft=b.time}else{if(done())cancel();return}}
 const slh=o.dir==1?b.low<=o.sl:b.high>=o.sl,tph=o.tp&&(o.dir==1?b.high>=o.tp:b.low<=o.tp);
 if(slh)close(o.sl,'止損',b);else if(tph)close(o.tp,'停利',b);else if(done()||b.time+60>=D[day].t0+33000)close(b.close,'15:00平',b)}
function close(px,why,b){const o=order,pts=(px-o.e)*o.dir,R=pts/Math.abs(o.e-o.sl);
 const L=getLog();L.push({d:day,t:hm(o.ft),x:hm(b.time),dir:o.dir,e:o.e,sl:o.sl,tp:o.tp,px,why,R:+R.toFixed(2),usd:+(pts*2).toFixed(1)});localStorage.mnqLog=JSON.stringify(L);
 order=null;clearLines(ordLines);showOrd();renderLog();alert(`${why}：${R>=0?'+':''}${R.toFixed(2)}R（$${(pts*2).toFixed(1)}）`)}
function cancel(){order=null;clearLines(ordLines);showOrd()}
function showOrd(){clearLines(ordLines);if(!order){$('ord').innerHTML='<small>無持倉</small>';return}const o=order;
 ordLines.push(cs.createPriceLine({price:o.e,color:'#2962ff',title:o.st=='pend'?'限價':'進場'}));ordLines.push(cs.createPriceLine({price:o.sl,color:'#f44336',title:'SL'}));if(o.tp)ordLines.push(cs.createPriceLine({price:o.tp,color:'#4caf50',title:'TP'}));
 const R=Math.abs(o.e-o.sl);$('ord').innerHTML=`${o.dir==1?'多':'空'} ${o.st=='pend'?'掛單中':'持倉中'} @${o.e} SL ${o.sl}${o.tp?' TP '+o.tp+'（'+(Math.abs(o.tp-o.e)/R).toFixed(1)+'R）':''}<br><small>1R = ${R.toFixed(2)} 點 = $${(R*2).toFixed(1)}</small>`}
function send(){if(order&&order.st=='open'){alert('已有持倉');return}if(done()){alert('今天已結束');return}const c=bars[idx-1].close;
 const e=typ=='mk'?c:parseFloat($('pe').value),sl=parseFloat($('psl').value),tp=parseFloat($('ptp').value)||null;
 if(isNaN(e)||isNaN(sl)){alert('請填進場與止損');return}if(side==1?sl>=e:sl<=e){alert('止損方向不對');return}if(tp&&(side==1?tp<=e:tp>=e)){alert('停利方向不對');return}
 order={dir:side,e,sl,tp,st:typ=='mk'?'open':'pend',ft:bars[idx-1].time};showOrd()}
function getLog(){try{return JSON.parse(localStorage.mnqLog||'[]')}catch(e){return[]}}
function renderLog(){const L=getLog();const w=L.filter(x=>x.R>0),gp=w.reduce((s,x)=>s+x.usd,0),gl=-L.filter(x=>x.R<=0).reduce((s,x)=>s+x.usd,0);
 const tR=L.reduce((s,x)=>s+x.R,0),tU=L.reduce((s,x)=>s+x.usd,0);
 $('stat').innerHTML=L.length?`${L.length} 筆｜勝率 ${(w.length/L.length*100).toFixed(0)}%｜<span class="${tR>=0?'pos':'neg'}">${tR.toFixed(2)}R / $${tU.toFixed(1)}</span>｜PF ${gl?(gp/gl).toFixed(2):'—'}`:'尚無紀錄';
 $('log').innerHTML='<tr><th>日期</th><th>進</th><th>方向</th><th>出場</th><th>R</th><th>$</th></tr>'+L.slice().reverse().map(x=>`<tr><td>${x.d.slice(5)}</td><td>${x.t}</td><td>${x.dir==1?'多':'空'}</td><td>${x.why} ${x.x}</td><td class="${x.R>=0?'pos':'neg'}">${x.R}</td><td>${x.usd}</td></tr>`).join('')}
function reveal(){if(revealed)return;revealed=true;const A=D[day].a,mk=[];let h='';
 for(const k of['v03','v04']){const a=A[k];if(!a){h+=`<p>${k}：無資料</p>`;continue}
  h+=`<p><b>${k}</b> 亞盤 ${a.rL}–${a.rH}<br>`+(a.trades.length?a.trades.map(t=>`${t.t} ${t.dir==1?'多':'空'}（${t.kind}）進 ${t.e} SL ${t.sl} 1:2 ${t.tp2} 1:3 ${t.tp} → ${t.res}（${t.R>=0?'+':''}${t.R}R）`).join('<br>'):'沒有訊號')+'</p>';
  for(const t of a.trades){const tt=bars.find(b=>hm(b.time)==t.t);if(tt)mk.push({time:sh(tf==5?tt.time-tt.time%300:tt.time),position:t.dir==1?'belowBar':'aboveBar',color:k=='v03'?'#ffeb3b':'#e040fb',shape:t.dir==1?'arrowUp':'arrowDown',text:k+(t.dir==1?'多':'空')});
   if(k=='v03'||!A.v03.trades.some(x=>x.t==t.t)){lines.push(cs.createPriceLine({price:t.e,color:k=='v03'?'#ffeb3b':'#e040fb',lineWidth:1,title:k+'進'}));lines.push(cs.createPriceLine({price:t.sl,color:'#f44336',lineWidth:1,lineStyle:1,title:k+'SL'}))}}
  if(a.log.length)h+=`<details><summary><small>${k} 過程</small></summary><small>${a.log.join('<br>')}</small></details>`}
 mk.sort((a,b)=>a.time-b.time);cs.setMarkers(mk);$('ansTxt').innerHTML=h}
function stop(){clearInterval(timer);timer=null;$('play').textContent='⏵ 自動';$('play').classList.remove('on')}
$('next').onclick=step;$('day').onchange=e=>load(e.target.value);$('rnd').onclick=()=>load(days[Math.floor(Math.random()*days.length)]);
$('play').onclick=()=>{if(timer)return stop();timer=setInterval(step,+$('spd').value);$('play').textContent='⏸ 暫停';$('play').classList.add('on')};
$('spd').onchange=()=>{if(timer){stop();$('play').click()}};
$('j10').onclick=()=>{while(!done()&&bars[idx-1].time+60<D[day].t0+15000){idx++;sim(bars[idx-1])}draw()};
$('end').onclick=()=>{while(!done()){idx++;sim(bars[idx-1])}draw()};
$('tf').onclick=()=>{tf=tf==1?5:1;$('tf').textContent=tf+'m';draw();if(revealed){revealed=false;clearLines(lines);asiaDrawn=false;draw();reveal()}};
$('bL').onclick=()=>{side=1;$('bL').className='on L';$('bS').className=''};$('bS').onclick=()=>{side=-1;$('bS').className='on S';$('bL').className=''};
$('mk').onclick=()=>{typ='mk';$('mk').className='on';$('lm').className=''};$('lm').onclick=()=>{typ='lm';$('lm').className='on';$('mk').className=''};
$('send').onclick=send;$('cxl').onclick=()=>{if(order&&order.st=='open'){if(confirm('以現價平倉？'))close(bars[idx-1].close,'手動平',bars[idx-1])}else cancel()};
$('ans').onclick=reveal;$('clr').onclick=()=>{if(confirm('清除全部紀錄？')){localStorage.mnqLog='[]';renderLog()}};

let ovk='v04';const cv=document.createElement('canvas');cv.style.cssText='position:absolute;left:0;top:0;pointer-events:none;z-index:5';$('chart').appendChild(cv);
function X(t){const f=bars[0].time,l=bars[idx-1].time;t=Math.max(f,Math.min(l,t));if(tf==5)t-=t%300;return ch.timeScale().timeToCoordinate(sh(t))}
function Y(p){return cs.priceToCoordinate(p)}
function curSug(){if(!ovk||!bars)return null;const O=D[day].o&&D[day].o[ovk];if(!O)return null;const T=bars[idx-1].time;
 for(const r of O.tr.slice().reverse())if(r[5]<=T&&(!r[6]||r[6]>T))return{dir:r[0],e:r[1],sl:r[2],tp:r[4],tp2:r[3],w:'訊號（'+r[7]+'）'+(r[5]==T?'剛出現':'已觸發')};
 for(const r of O.fb)if(r[4]<=T&&(!r[5]||r[5]>T))return{dir:r[0],e:r[1],sl:r[2],tp:r[3],tp2:r[1]+(r[3]-r[1])*2/3,w:'補掛限價'};
 if(O.off&&O.off<=T)return null;
 const act=[...O.ob.map(r=>({d:r[0],top:r[1],bot:r[2],vt:r[4],end:Math.min(r[5]||1e12,r[6]||1e12)})),...O.tob.map(r=>({d:r[0],top:r[1],bot:r[2],vt:r[4],end:r[5]||1e12}))].filter(z=>z.vt<=T&&z.end>T).sort((a,b)=>b.vt-a.vt);
 if(!act.length)return null;const z=act[0],e=z.d==1?z.top:z.bot,sl=z.d==1?z.bot-.25:z.top+.25,R=Math.abs(e-sl);
 return{dir:z.d,e,sl,tp:e+z.d*3*R,tp2:e+z.d*2*R,w:'最新 OB 邊緣掛單（尚未收針，僅候選）'}}
function ovDraw(){const w=$('chart').clientWidth,h=$('chart').clientHeight,dp=devicePixelRatio||1;cv.width=w*dp;cv.height=h*dp;cv.style.width=w+'px';cv.style.height=h+'px';
 const g=cv.getContext('2d');g.setTransform(dp,0,0,dp,0,0);g.clearRect(0,0,w,h);const S=curSug();
 $('sug').innerHTML=S?`<small>指標建議：${S.dir==1?'多':'空'} 限價 ${S.e} SL ${S.sl} 1:2 ${S.tp2.toFixed(2)} 1:3 ${S.tp.toFixed(2)}｜${S.w}</small>`:'<small>指標：目前沒有建議</small>';
 if(!ovk||!bars)return;const O=D[day].o&&D[day].o[ovk];if(!O)return;const T=bars[idx-1].time,pw=ch.timeScale().width();g.save();g.beginPath();g.rect(0,0,pw,h);g.clip();g.font='10px sans-serif';
 const box=(x0,x1,top,bot,fill,stroke,mid,lab)=>{const a=X(x0),b=X(x1),y1=Y(top),y2=Y(bot);if(a==null||b==null||y1==null||y2==null)return;const bb=Math.max(b,a+4);
  g.fillStyle=fill;g.fillRect(a,y1,bb-a,y2-y1);g.strokeStyle=stroke;g.lineWidth=1;g.setLineDash([]);g.strokeRect(a,y1,bb-a,y2-y1);
  if(mid){const ym=Y((top+bot)/2);g.setLineDash([3,3]);g.beginPath();g.moveTo(a,ym);g.lineTo(bb,ym);g.stroke();g.setLineDash([])}
  if(lab){g.fillStyle=stroke;g.fillText(lab,a+2,y1-2)}};
 const hl=(x0,x1,p,c,lab,dash)=>{const a=X(x0),b=X(x1),y=Y(p);if(a==null||b==null||y==null)return;g.strokeStyle=c;g.setLineDash(dash||[]);g.lineWidth=1.5;g.beginPath();g.moveTo(a,y);g.lineTo(Math.max(b,a+30),y);g.stroke();g.setLineDash([]);g.fillStyle=c;g.fillText(lab+' '+p.toFixed(2),Math.max(b,a+30)+2,y+3)};
 const actIds=O.ob.map((r,i)=>[r,i]).filter(([r])=>r[4]<=T&&!(r[5]&&r[5]<=T)&&!(r[6]&&r[6]<=T)).slice(-3).map(x=>x[1]);
 for(const [ii,r] of O.ob.entries()){if(r[4]>T)continue;const ended=Math.min(r[5]||1e12,r[6]||1e12);if(!actIds.includes(ii)&&!(ended<=T&&T-ended<3600))continue;const inv=r[6]&&r[6]<=T,used=r[5]&&r[5]<=T,end=Math.min(inv?r[6]:1e12,used?r[5]:1e12,T);
  const c=inv?'#888':(r[0]==1?'#26a69a':'#ef5350');box(r[3],end,r[1],r[2],inv?'rgba(136,136,136,.15)':(used?'rgba(255,255,255,.04)':(r[0]==1?'rgba(38,166,154,.18)':'rgba(239,83,80,.18)')),c,!inv,(inv?'作廢 ':'')+(r[0]==1?'多OB':'空OB')+(r[7]?'':' CHoCH'))}
 for(const r of O.tob){if(r[4]>T)continue;const end=r[5]&&r[5]<=T?r[5]:T;box(r[3],end,r[1],r[2],'rgba(224,64,251,.18)','#e040fb',true,'單邊小OB')}
 for(const r of O.fb){if(r[4]>T)continue;const end=r[5]&&r[5]<=T?r[5]:T;hl(r[4],end,r[1],'#ff9800','補掛',[4,3]);hl(r[4],end,r[2],'#f44336','SL',[4,3])}
 for(const r of O.tr){if(r[5]>T)continue;const end=r[6]&&r[6]<=T?r[6]:T;const x=X(r[5]),yb=Y(r[0]==1?r[2]:r[2]);
  hl(r[5],end,r[1],'#2962ff','進');hl(r[5],end,r[2],'#f44336','SL');hl(r[5],end,r[3],'#81c784','1:2',[2,2]);hl(r[5],end,r[4],'#4caf50','1:3');
  const b=bars.find(q=>q.time==r[5]);if(b&&x!=null){const y=Y(r[0]==1?b.low:b.high)+(r[0]==1?12:-12);g.fillStyle='#ffeb3b';g.beginPath();if(r[0]==1){g.moveTo(x,y-8);g.lineTo(x-5,y);g.lineTo(x+5,y)}else{g.moveTo(x,y+8);g.lineTo(x-5,y);g.lineTo(x+5,y)}g.fill();g.fillText(r[7]=='補單'?'補單成交':(r[7]=='單邊'?'單邊收針':'收針'+(r[7].includes('寬')?'(寬)':'')),x-14,r[0]==1?y+12:y-10)}}
 if(O.off&&O.off<=T){g.fillStyle='#ffeb3b';g.font='bold 13px sans-serif';g.fillText('今日收工',8,18)}
 g.restore()}
ch.timeScale().subscribeVisibleLogicalRangeChange(()=>requestAnimationFrame(ovDraw));new ResizeObserver(()=>requestAnimationFrame(ovDraw)).observe($('chart'));
$('chart').addEventListener('pointerup',()=>setTimeout(ovDraw,30));
$('ovb').onclick=()=>{ovk=ovk=='v04'?'v03':ovk=='v03'?null:'v04';$('ovb').textContent=ovk?'指標 '+ovk.replace('v0','v0.'):'指標 關';$('ovb').classList.toggle('on',!!ovk);ovDraw()};
$('fill').onclick=()=>{const S=curSug();if(!S){$('sug').innerHTML='<small>⚠️ 指標目前沒有建議，無法帶入</small>';return}(S.dir==1?$('bL'):$('bS')).click();$('lm').click();$('pe').value=S.e;$('psl').value=S.sl;$('ptp').value=S.tp.toFixed(2)};
renderLog();load(days[days.length-1]);if(location.hash.startsWith('#d=')){const q=location.hash.slice(3).split('@');load(q[0]);while(!done()&&hm(bars[idx-1].time)<q[1]){idx++}draw();if(q[2]=='f')setTimeout(()=>$('fill').click(),200)}
if(location.hash=='#t'){load('2026-10-08');$('end').click();reveal()}
</script></body></html>
